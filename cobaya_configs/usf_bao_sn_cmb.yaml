# Gerado no Tópico 9 do plano de correção (grade de runs do Tópico 4).
# Esquema de calibração: docs/SN_CALIBRATION.md. Seed fixo p/ reprodutibilidade.
packages_path: ./cobaya_packages

params:
  H0:
    prior: { min: 60, max: 80 }
    ref: 70.0
    proposal: 0.5
    latex: H_0
  Omega_m:
    prior: { min: 0.2, max: 0.4 }
    ref: 0.310
    proposal: 0.005
    latex: \Omega_m
  omega_b: # Ω_b h² com prior gaussiano de BBN (Schöneberg 2024)
    prior: { dist: norm, loc: 0.02218, scale: 0.00055 }
    ref: 0.02218
    proposal: 0.0003
    latex: \omega_b
  Omega_TW:
    prior: { min: 0.0, max: 0.3 }
    ref: 0.03
    proposal: 0.005
    latex: \Omega_{\rm TW}
  n:
    prior: { min: -2.0, max: 5.0 }
    ref: 1.0
    proposal: 0.1
    latex: n

theory:
  theory_module.usf_background.USF:
    python_path: .

likelihood:
  theory_module.cmb_distance_priors.CMBDistancePriors: # Planck 2018 distance priors (Chen+19)
    python_path: .
  theory_module.bao_desi_likelihood.BAODESILikelihood:
    python_path: .
    data_path: ./cobaya_packages/data/bao_data/desi_bao_dr2
  sn.pantheonplus: null # M marginalizado analiticamente (docs/SN_CALIBRATION.md)

output: chains/usf_bao_sn_cmb
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_tries: 10000
    seed: 1009
